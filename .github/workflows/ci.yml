name: mnist-cnn-rtl-sim-ci

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install simulator
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Invoke current compile target (scaffold)
        run: |
          cd sim
          make compile

      - name: Invoke current run target (scaffold)
        run: |
          cd sim
          make run

      - name: Report scaffold status
        run: echo "Workflow commands returned; functional RTL/reference and accuracy checks remain TODO."

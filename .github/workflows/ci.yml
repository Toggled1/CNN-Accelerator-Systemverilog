name: mnist-cnn-rtl-sim-ci

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install simulator
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Compile the CNN RTL simulation
        run: |
          cd sim
          make compile

      - name: Run the testbench against committed fixtures
        run: |
          cd sim
          make run

      - name: Show test summary
        run: echo "RTL/reference agreement and MNIST accuracy checks completed."
